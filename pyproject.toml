[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jour-cli"
version = "0.1.0"
dependencies = [
    "PyYAML",
]
requires-python = ">=3.8"
description = "Minimal CLI Journal"

[project.scripts]
jour = "jour_cli.main:main"

[tool.setuptools.packages.find]
include = ["jour_cli*"]
