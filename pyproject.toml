[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jour-cli"
version = "0.1.0a1"
dependencies = [
    "jmespath",
    "PyYAML",
    "typer",
]
requires-python = ">=3.8"
description = "Minimal CLI Journal"
classifiers = [
    "Development Status :: 3 - Alpha",
]

[project.scripts]
jour = "jour_cli.main:main"

[tool.setuptools.packages.find]
include = ["jour_cli*"]